version: 1
site: acme
apiUrl: https://api.gravitydocs.io
product:
  slug: Acme Platform
  repo: billing
  role: frontend
spaces:
  default: product
  shared: [platform]
  parent: root
  home: overview
  declare:
    - slug: product
      name: Product docs
      type: product-docs
      audiences: [users]
    - slug: api
      name: API
      parent: product
      type: api-reference
      visibility: public
sources:
  - source: api/openapi.yaml
    kind: openapi
    space: api
    page: billing-api
    title: Billing API
    collection: reference
    generator: legacy
  - source: api/admin.yaml
    space: api
  - source: src/handlers
    kind: code
documents:
  - file: docs/guide.md
    space: product
    page: guide
    title: Guide
    ownership: human
    version: "2"
  - file: docs/faq.md
    space: product
    collection: help
  - file: CHANGELOG.md
    as: release
releaseNotes:
  space: changelog
  changelog: CHANGELOG.md
knowledge:
  namespace: product:acme-platform/billing
  scope: repo
discovery:
  units: feature
  include: ['src/**']
  exclude: ['src/**/*.test.ts']
  entrypoints: [src/routes]
  audiences:
    default: [users]
i18n:
  languages: [fr, de]
coverage:
  min: 80
  require: [checkout, api]

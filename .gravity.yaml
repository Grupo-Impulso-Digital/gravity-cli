version: 2
product: gravity
apiUrl: https://api.gravitydocs.io
code:
  entrypoints: [cmd/gravity/main.go, internal/cli/root.go]
  exclude: [dist/**, '**/*_test.go', '**/testdata/**']
  units:
    kind: capability
docs:
  include: [README.md, AGENTS.md, ci/README.md, docs/**/*.md]
passes:
  - name: cli-guides
    kind: guides
    template: developer-guide
    target: gravity/cli
    triggers: [push, pr]
    audiences: [developers]
    instructions: |
      Document the gravity CLI for engineers who connect a repository and run
      it in CI: commands, flags, exit codes, the .gravity.yaml manifest and the
      CI templates. Every example must run as written.
    options:
      languages: [fr]
  - name: handbook
    kind: verbatim
    target: gravity/internal
    triggers: [push]
    options:
      adopt: true
      files:
        - include: docs/platform-authoring-api.md
          slug: platform-authoring-api
          title: Platform authoring API (CLI-side contract mirror)
  - name: changelog
    kind: changelog
    template: customer-changelog
    target: gravity/changelog
    triggers: [push, release]
    options:
      source: changelog-file
      changelogFile: CHANGELOG.md
  - name: memory
    kind: nucleus
    template: nucleus-facts
    triggers: [push]
  - name: pr-check
    kind: check
    triggers: [pr]
    options:
      coverageMin: 0.7
      failOn: [drift, claims, verbatim]

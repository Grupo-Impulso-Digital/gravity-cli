name: release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require the major-pinned 0.x release before 1.x
        if: startsWith(inputs.tag || github.ref_name, 'v1.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v0\\.[0-9]+\\.[0-9]+$"))] | first // empty')"
          if [ -z "$tag" ]; then
            echo "::error::no v0.x release exists; ship the major-pinned v0.3.x release (milestone C0.1) before any v1 tag"
            exit 1
          fi
          action="$(gh api "repos/$GITHUB_REPOSITORY/contents/ci/github/action.yml?ref=$tag" --jq .content | base64 -d)"
          installer="$(gh api "repos/$GITHUB_REPOSITORY/contents/install.sh?ref=$tag" --jq .content | base64 -d)"
          if ! printf '%s\n' "$action" | grep -Eq "default: ['\"]?0['\"]?$"; then
            echo "::error::$tag's ci/github action still defaults to latest; v0.x pipelines would install 1.0"
            exit 1
          fi
          if ! printf '%s\n' "$installer" | grep -Eq 'GRAVITY_VERSION:?[=-]"?0"?[^0-9.]'; then
            echo "::error::$tag's install.sh does not default to major 0"
            exit 1
          fi
          echo "$tag pins v0 pipelines to major 0"

  goreleaser:
    needs: gate
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        id: goreleaser
        continue-on-error: true
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}

      - name: Verify the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.goreleaser.outcome }}
        run: |
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
          if [ "$assets" -eq 0 ]; then
            echo "::error::GoReleaser did not publish $TAG"
            exit 1
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "::warning::$TAG is published with $assets assets, but GoReleaser failed after the release (usually the Homebrew tap or Scoop bucket: GORELEASER_TOKEN needs contents:write on Grupo-Impulso-Digital/homebrew-tap and Grupo-Impulso-Digital/scoop-bucket)"
          fi

      - name: Move the major tag of the GitHub action
        if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
        run: |
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          major="${TAG%%.*}"
          git tag -f "$major" "$sha"
          git push -f origin "refs/tags/$major"

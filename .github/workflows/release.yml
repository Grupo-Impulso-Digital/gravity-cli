name: release

# Cut a release by pushing a semver tag:
#   git tag v0.1.0 && git push origin v0.1.0
# GoReleaser builds every OS/arch, uploads the archives + checksums as GitHub
# Release assets, and pushes the Homebrew formula + Scoop manifest.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # default token: creates the release in THIS repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to Grupo-Impulso-Digital/homebrew-tap +
          # Grupo-Impulso-Digital/scoop-bucket (see AGENTS.md for exact scopes).
          # Set it in repo settings → Secrets → Actions. Without it the release
          # still ships binaries; only the tap/bucket publish steps fail.
          GORELEASER_TOKEN: ${{ secrets.GORELEASER_TOKEN }}

      - name: Move the major tag of the GitHub action
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

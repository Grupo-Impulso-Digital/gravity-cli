name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-ci:
    uses: Grupo-Impulso-Digital/workflows/.github/workflows/go-ci.yml@v1
    with:
      go-version: '1.23'
      working-directory: '.'
      # No .golangci config exists yet — leave lint off until the repo
      # adopts a lint config and fixes any resulting findings.
      run-golangci-lint: false
      coverage-floor: 0
    secrets: inherit

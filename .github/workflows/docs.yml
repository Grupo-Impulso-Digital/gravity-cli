name: Docs (Gravity)

on:
  push:
    branches: [develop]
    tags: ['v*.*.*', '!v*.*.*-*']
  pull_request:
    branches: [develop, 'hotfix/**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gravity:
    runs-on: ubuntu-latest
    env:
      GRAVITY_TRIGGER: ${{ github.ref_type == 'tag' && 'release' || '' }}
      GRAVITY_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./ci/github
        with:
          repo-token: ${{ secrets.GRAVITY_REPO_TOKEN }}
          token: ${{ secrets.GRAVITY_TOKEN }}
          version: source

name: Docs (Gravity)

# This repo's own Gravity pipeline, and the reference implementation of the CI
# cadence documented in ci/README.md:
#
#   pull request     check docs + check api      advisory annotations
#   push to main     ping -> sync -> docs generate --since <last green sha>
#   release          release-notes
#
# It composes the LOCAL composite action (./ci/github) instead of calling
# Grupo-Impulso-Digital/workflows' gravity-docs.yml, for exactly the reason
# .github/workflows/ci.yml is self-contained: gravity-cli is a PUBLIC repository
# and that workflows repo is PRIVATE, so its reusable workflows are unreachable
# from here. Running the composite action also dogfoods the contract downstream
# consumers get.
#
# Everything gravity writes is a draft + open proposal, so nothing here changes
# live documentation without a human approving it in the app. Slugs live in
# .gravity.yaml; GRAVITY_TOKEN is an org secret.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    name: check (pull request)
    # Fork PRs get no secrets, so the checks would only ever exit 2 there.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GRAVITY_TOKEN: ${{ secrets.GRAVITY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check docs --ai and release-notes resolve git ranges

      # The repo secret is not configured yet on this public repository —
      # skip with a notice instead of failing every run on an auth error.
      - name: Gate on token
        id: gate
        run: |
          if [ -n "$GRAVITY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GRAVITY_TOKEN secret is not set - docs pipeline skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check docs
        if: steps.gate.outputs.ready == 'true'
        uses: ./ci/github
        with:
          token: ${{ secrets.GRAVITY_TOKEN }}
          api-url: ${{ vars.GRAVITY_API_URL || 'https://app.gravitydocs.io' }}
          site: ${{ vars.GRAVITY_SITE }}
          command: check docs
          args: --ci --format github
          continue-on-findings: "true"

      - name: Check api
        if: steps.gate.outputs.ready == 'true'
        uses: ./ci/github
        with:
          token: ${{ secrets.GRAVITY_TOKEN }}
          api-url: ${{ vars.GRAVITY_API_URL || 'https://app.gravitydocs.io' }}
          site: ${{ vars.GRAVITY_SITE }}
          command: check api
          args: --ci --format github
          continue-on-findings: "true"

  live:
    name: sync + generate (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Two overlapping runs would race on page attribution (last-writer-wins) and
    # on the declarative inventory, so queue rather than cancel.
    concurrency:
      group: gravity-docs-live
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # gh run list, to resolve the incremental base
    env:
      GRAVITY_TOKEN: ${{ secrets.GRAVITY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo secret is not configured yet on this public repository —
      # skip with a notice instead of failing every run on an auth error.
      - name: Gate on token
        id: gate
        run: |
          if [ -n "$GRAVITY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GRAVITY_TOKEN secret is not set - docs pipeline skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Register this repo
        if: steps.gate.outputs.ready == 'true'
        uses: ./ci/github
        with:
          token: ${{ secrets.GRAVITY_TOKEN }}
          api-url: ${{ vars.GRAVITY_API_URL || 'https://app.gravitydocs.io' }}
          site: ${{ vars.GRAVITY_SITE }}
          command: ping
          args: ""

      - name: Sync declared mappings
        if: steps.gate.outputs.ready == 'true'
        uses: ./ci/github
        with:
          token: ${{ secrets.GRAVITY_TOKEN }}
          api-url: ${{ vars.GRAVITY_API_URL || 'https://app.gravitydocs.io' }}
          site: ${{ vars.GRAVITY_SITE }}
          command: sync
          args: --ci
          continue-on-findings: "true"

      - name: Resolve incremental base
        id: base
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The previous SUCCESSFUL run's commit, never HEAD~1: a failed or
          # skipped run must not leave a permanent documentation gap. An empty
          # ref means a full survey, which is always correct, only slower.
          sha="$(gh run list --workflow=docs.yml --branch=main --status=success \
                   --limit=1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)"
          if [ -z "$sha" ]; then
            sha="$(git rev-parse --verify --quiet 'docs-synced^{commit}' || true)"
          fi
          if [ -n "$sha" ] && ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            sha=""
          fi
          if [ -z "$sha" ]; then
            echo "no green base resolved; running a full survey"
          else
            echo "incremental base: $sha"
          fi
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

      - name: Generate docs from code
        if: steps.gate.outputs.ready == 'true'
        uses: ./ci/github
        with:
          token: ${{ secrets.GRAVITY_TOKEN }}
          api-url: ${{ vars.GRAVITY_API_URL || 'https://app.gravitydocs.io' }}
          site: ${{ vars.GRAVITY_SITE }}
          command: docs generate
          args: --ci
          since: ${{ steps.base.outputs.ref }}
          continue-on-findings: "true"

  release:
    name: release notes
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GRAVITY_TOKEN: ${{ secrets.GRAVITY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo secret is not configured yet on this public repository —
      # skip with a notice instead of failing every run on an auth error.
      - name: Gate on token
        id: gate
        run: |
          if [ -n "$GRAVITY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GRAVITY_TOKEN secret is not set - docs pipeline skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes
        if: steps.gate.outputs.ready == 'true'
        uses: ./ci/github
        with:
          token: ${{ secrets.GRAVITY_TOKEN }}
          api-url: ${{ vars.GRAVITY_API_URL || 'https://app.gravitydocs.io' }}
          site: ${{ vars.GRAVITY_SITE }}
          command: release-notes
          args: --ci --output proposal
          continue-on-findings: "true"

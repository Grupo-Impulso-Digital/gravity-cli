name: Docs (Gravity)

on:
  workflow_dispatch:
    inputs:
      from:
        description: Release notes start ref (e.g. v0.2.0)
        required: true
      to:
        description: Release notes end ref (e.g. v0.2.1)
        required: true

permissions:
  contents: read

jobs:
  check:
    name: check (pull request)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GRAVITY_TOKEN: ${{ secrets.GRAVITY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate on token
        id: gate
        run: |
          if [ -n "$GRAVITY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GRAVITY_TOKEN secret is not set - docs pipeline skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check docs
        if: steps.gate.outputs.ready == 'true'
        uses: ./ci/github
        with:
          token: ${{ secrets.GRAVITY_TOKEN }}
          api-url: ${{ vars.GRAVITY_API_URL }}
          version: source
          command: check docs
          continue-on-findings: ${{ vars.GRAVITY_FAIL_ON_FINDINGS == 'true' && 'false' || 'true' }}

      - name: Check api
        if: steps.gate.outputs.ready == 'true'
        uses: ./ci/github
        with:
          token: ${{ secrets.GRAVITY_TOKEN }}
          api-url: ${{ vars.GRAVITY_API_URL }}
          version: source
          command: check api
          continue-on-findings: ${{ vars.GRAVITY_FAIL_ON_FINDINGS == 'true' && 'false' || 'true' }}

  live:
    name: sync + generate (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: gravity-docs-live
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      GRAVITY_TOKEN: ${{ secrets.GRAVITY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate on token
        id: gate
        run: |
          if [ -n "$GRAVITY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GRAVITY_TOKEN secret is not set - docs pipeline skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Register this repo
        if: steps.gate.outputs.ready == 'true'
        uses: ./ci/github
        with:
          token: ${{ secrets.GRAVITY_TOKEN }}
          api-url: ${{ vars.GRAVITY_API_URL }}
          version: source
          command: ping

      - name: Sync declared mappings
        if: steps.gate.outputs.ready == 'true'
        uses: ./ci/github
        with:
          token: ${{ secrets.GRAVITY_TOKEN }}
          api-url: ${{ vars.GRAVITY_API_URL }}
          version: source
          command: sync
          continue-on-findings: "true"

      - name: Resolve incremental base
        id: base
        if: steps.gate.outputs.ready == 'true' && vars.GRAVITY_DOCS_GENERATE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh run list --workflow=docs.yml --branch=main --status=success \
                   --limit=1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)"
          if [ -z "$sha" ]; then
            sha="$(git rev-parse --verify --quiet 'docs-synced^{commit}' || true)"
          fi
          if [ -n "$sha" ] && ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            sha=""
          fi
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

      - name: Generate docs from code
        if: steps.gate.outputs.ready == 'true' && vars.GRAVITY_DOCS_GENERATE == 'true'
        uses: ./ci/github
        with:
          token: ${{ secrets.GRAVITY_TOKEN }}
          api-url: ${{ vars.GRAVITY_API_URL }}
          version: source
          command: docs generate
          since: ${{ steps.base.outputs.ref }}
          continue-on-findings: "true"

  release:
    name: release notes
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GRAVITY_TOKEN: ${{ secrets.GRAVITY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate on token
        id: gate
        run: |
          if [ -n "$GRAVITY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GRAVITY_TOKEN secret is not set - docs pipeline skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release range
        id: range
        if: steps.gate.outputs.ready == 'true'
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to || github.ref_name }}
        run: |
          git rev-parse --verify --quiet "${TO}^{commit}" >/dev/null
          ARGS="--output proposal --to ${TO}"
          if [ -n "$FROM" ]; then
            git rev-parse --verify --quiet "${FROM}^{commit}" >/dev/null
            ARGS="${ARGS} --from ${FROM}"
          fi
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"

      - name: Release notes
        if: steps.gate.outputs.ready == 'true'
        uses: ./ci/github
        with:
          token: ${{ secrets.GRAVITY_TOKEN }}
          api-url: ${{ vars.GRAVITY_API_URL }}
          version: source
          command: release-notes
          args: ${{ steps.range.outputs.args }}
          continue-on-findings: "true"

name: auto-release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          heading="$(grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md || true)"
          tag="$(printf '%s\n' "$heading" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' | head -n1)"
          if [ -z "$tag" ] || printf '%s' "$heading" | grep -qi 'unreleased'; then
            echo "The top CHANGELOG.md section is not a dated release; nothing to do."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already tagged."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  tag:
    needs: detect
    if: needs.detect.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          git tag "${{ needs.detect.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ needs.detect.outputs.tag }}"

  release:
    needs: [detect, tag]
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.detect.outputs.tag }}
    secrets: inherit

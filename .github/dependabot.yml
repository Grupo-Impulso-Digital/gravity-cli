version: 2
updates:
    - package-ecosystem: gomod
      directory: /
      target-branch: main
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/Toronto
      open-pull-requests-limit: 10
      labels: [dependencies]
      commit-message:
          prefix: chore(deps)
      groups:
          go-minor-patch:
              update-types: [minor, patch]
      cooldown:
          default-days: 3

    - package-ecosystem: github-actions
      directory: /
      target-branch: main
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/Toronto
      labels: [dependencies]
      commit-message:
          prefix: chore(ci)
      groups:
          actions-minor-patch:
              update-types: [minor, patch]

# Gravity docs pipeline for GitLab CI.
#
# Set GRAVITY_TOKEN as a *masked, protected* CI/CD variable (Settings > CI/CD >
# Variables). Site, spaces and API URL come from the committed .gravity.yaml;
# set GRAVITY_SITE / GRAVITY_API_URL variables only to override it.
#
# Cadence (see ci/README.md):
#   merge request         check docs + check api        read-only
#   push to LIVE_BRANCH   ping -> sync -> docs generate --since <last green sha>
#   tag                   release-notes
#
# Exit-code convention: 0 pass, 1 findings, 2 error, 3 licence refusal. The
# merge-request jobs let findings fail the pipeline so drift is visible; the
# live/tag jobs allow exit 1 only (`allow_failure: exit_codes`), because
# documentation drift must never gate a deploy while a broken setup still must.

variables:
  LIVE_BRANCH: "main"
  # Pin a release (e.g. v0.3.0) for reproducible pipelines; "latest" follows
  # the newest release.
  GRAVITY_CLI_VERSION: "latest"
  # release-notes, `check docs --ai` and `--since` all walk git history; a
  # shallow clone hides it.
  GIT_DEPTH: 0

stages:
  - test
  - docs
  - deploy

.gravity_base:
  image: buildpack-deps:bookworm-scm
  cache:
    key: gravity-cli-$GRAVITY_CLI_VERSION
    paths:
      - .gravity-bin/
  before_script:
    # Prebuilt release binary (checksum-verified by the installer), cached per
    # pinned version; "latest" is re-resolved on every run.
    - |
      if [ "$GRAVITY_CLI_VERSION" = "latest" ] || [ ! -x .gravity-bin/gravity ]; then
        curl -fsSL https://raw.githubusercontent.com/Grupo-Impulso-Digital/gravity-cli/main/install.sh \
          | GRAVITY_VERSION="$GRAVITY_CLI_VERSION" GRAVITY_INSTALL_DIR="$CI_PROJECT_DIR/.gravity-bin" sh
      fi
    - export PATH="$CI_PROJECT_DIR/.gravity-bin:$PATH"
    - gravity version

# ---------------------------------------------------------------- merge request
# Read-only. These never author anything, so exit 1 keeps its meaning.

docs:check:
  extends: .gravity_base
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - gravity check docs --ci --format text
  # allow_failure: true   # uncomment to make findings advisory

api:check:
  extends: .gravity_base
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    # Diffs every OpenAPI spec mapped under `sources` in .gravity.yaml; with
    # none, verifies each api block's source-binding hash.
    - gravity check api --ci --format text

# ------------------------------------------------------------ push to the live
# `resource_group` serializes these: two overlapping runs would race on page
# attribution (last-writer-wins) and on the declarative inventory.

docs:sync:
  extends: .gravity_base
  stage: docs
  resource_group: gravity-docs-live
  rules:
    - if: $CI_COMMIT_BRANCH == $LIVE_BRANCH
  script:
    # ping registers/refreshes this repo (branch, commit, manifest) so
    # attribution and coverage see the right revision. Cheap and idempotent.
    - gravity ping --ci
    # sync first: it shapes spaces/collections/home pages so generated pages
    # land in an existing structure.
    - gravity sync --ci
  allow_failure:
    exit_codes: 1

docs:generate:
  extends: .gravity_base
  stage: docs
  needs: ["docs:sync"]
  resource_group: gravity-docs-live
  rules:
    - if: $CI_COMMIT_BRANCH == $LIVE_BRANCH
  script:
    # The incremental base is the previous SUCCESSFUL run's commit, never
    # HEAD~1 — a failed or skipped run must not leave a permanent gap. The job
    # reads a `docs-synced` marker tag; with no tag it falls back to a full
    # survey, which is always correct.
    - git fetch --tags --force --quiet || true
    - SINCE="$(git rev-parse --verify --quiet 'docs-synced^{commit}' || true)"
    - if [ -n "$SINCE" ]; then gravity docs generate --ci --since "$SINCE"; else gravity docs generate --ci; fi
    # Move the marker on success. Needs GRAVITY_CI_PUSH_TOKEN: a project access
    # token with write_repository (masked, protected). Without it every run is
    # a full survey.
    - |
      if [ -n "$GRAVITY_CI_PUSH_TOKEN" ]; then
        git tag -f docs-synced "$CI_COMMIT_SHA"
        git push -f "https://oauth2:${GRAVITY_CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" refs/tags/docs-synced
      else
        echo "note: GRAVITY_CI_PUSH_TOKEN is not set; the docs-synced marker was not moved, so the next run is a full survey"
      fi
  allow_failure:
    exit_codes: 1

docs:coverage:
  extends: .gravity_base
  stage: docs
  needs: ["docs:generate"]
  rules:
    - if: $CI_COMMIT_BRANCH == $LIVE_BRANCH
  script:
    # --min defaults to coverage.min from .gravity.yaml; exit 1 when the ratio
    # is below it or a coverage.require page is missing.
    - gravity coverage --ci --format text
  allow_failure:
    exit_codes: 1

# ------------------------------------------------------------------------ tag

release-notes:
  extends: .gravity_base
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # Lands in releaseNotes.space from .gravity.yaml (default: changelog).
    - gravity release-notes --ci --output proposal
  allow_failure:
    exit_codes: 1

name: Gravity
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  gravity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Grupo-Impulso-Digital/gravity-cli/ci/github@v1
        with:
          repo-token: ${{ secrets.GRAVITY_REPO_TOKEN }}
          token: ${{ secrets.GRAVITY_TOKEN }}

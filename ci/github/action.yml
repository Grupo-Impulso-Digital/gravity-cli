name: "Gravity CI"
description: "Run gravity docs checks, sync, incremental generation, and release-notes in CI."
author: "impulso"

inputs:
  token:
    description: "Gravity API token (sk_live_...). Pass from a secret, e.g. secrets.GRAVITY_TOKEN."
    required: true
  api-url:
    description: "Gravity API base URL. Leave empty so .gravity.yaml (or the hosted default) wins; set it only for a self-hosted platform."
    required: false
    default: ""
  site:
    description: "Site slug override. Leave empty so .gravity.yaml wins."
    required: false
    default: ""
  command:
    description: "Which gravity command to run: 'ping', 'repos', 'check api', 'check docs', 'sync', 'docs generate', 'coverage', or 'release-notes'."
    required: true
    default: "check docs"
  args:
    description: "Extra arguments appended to the command (e.g. '--openapi openapi.yaml')."
    required: false
    default: ""
  format:
    description: "Output format for the commands that take --format (check api, check docs, coverage). Ignored by every other command."
    required: false
    default: "github"
  since:
    description: "Git ref appended as '--since <ref>' for an incremental 'docs generate'. Empty runs the full survey. Must be the previous SUCCESSFUL run's commit, never HEAD~1."
    required: false
    default: ""
  continue-on-findings:
    description: "Treat exit 1 (findings) as success. Exit 2 (auth/network/bad config) and exit 3 (licence) still fail the step. Use on push/release jobs so documentation drift never gates a deploy."
    required: false
    default: "false"
  version:
    description: "gravity CLI to install: a major version (0, the default, installs the newest 0.x release), a release tag such as v0.3.0, latest, or source (builds the CLI from this action's own checkout, for the CLI repo's own CI)."
    required: false
    default: "0"

runs:
  using: "composite"
  steps:
    - name: Resolve gravity version
      id: resolve
      shell: bash
      env:
        GRAVITY_VERSION: ${{ inputs.version }}
        GRAVITY_RESOLVE_ONLY: "1"
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$GRAVITY_VERSION" = "source" ]; then
          tag=source
        else
          tag="$(sh "${GITHUB_ACTION_PATH}/../../install.sh")"
        fi
        if [ -z "$tag" ]; then
          echo "::error::could not resolve gravity version '$GRAVITY_VERSION'"
          exit 2
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "dir=${RUNNER_TOOL_CACHE}/gravity/${tag}-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

    - name: Cache gravity
      id: cache
      if: steps.resolve.outputs.tag != 'source'
      uses: actions/cache@v4
      with:
        path: ${{ steps.resolve.outputs.dir }}
        key: gravity-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.tag }}

    - name: Install gravity (release binary)
      if: steps.resolve.outputs.tag != 'source' && steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      env:
        GRAVITY_VERSION: ${{ steps.resolve.outputs.tag }}
        GRAVITY_INSTALL_DIR: ${{ steps.resolve.outputs.dir }}
      run: sh "${GITHUB_ACTION_PATH}/../../install.sh"

    - name: Install gravity (release binary, Windows)
      if: steps.resolve.outputs.tag != 'source' && steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        GRAVITY_VERSION: ${{ steps.resolve.outputs.tag }}
        GRAVITY_INSTALL_DIR: ${{ steps.resolve.outputs.dir }}
      run: '& (Join-Path $env:GITHUB_ACTION_PATH "../../install.ps1")'

    - name: Set up Go (source build)
      if: steps.resolve.outputs.tag == 'source'
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/../../go.mod
        cache: false

    - name: Build gravity (source)
      if: steps.resolve.outputs.tag == 'source'
      shell: bash
      env:
        GRAVITY_INSTALL_DIR: ${{ steps.resolve.outputs.dir }}
      run: |
        mkdir -p "$GRAVITY_INSTALL_DIR"
        cd "${GITHUB_ACTION_PATH}/../.."
        go build -o "$GRAVITY_INSTALL_DIR/gravity" ./cmd/gravity

    - name: Put gravity on PATH
      shell: bash
      env:
        GRAVITY_INSTALL_DIR: ${{ steps.resolve.outputs.dir }}
      run: |
        echo "$GRAVITY_INSTALL_DIR" >> "$GITHUB_PATH"
        "$GRAVITY_INSTALL_DIR/gravity" version

    - name: Run gravity
      shell: bash
      env:
        GRAVITY_TOKEN: ${{ inputs.token }}
        GRAVITY_API_URL: ${{ inputs.api-url }}
        GRAVITY_SITE: ${{ inputs.site }}
        # Caller-supplied values reach the script as environment variables, never
        # as `${{ }}` interpolated into the script body, so a crafted input
        # cannot become shell.
        GRAVITY_COMMAND: ${{ inputs.command }}
        GRAVITY_ARGS: ${{ inputs.args }}
        GRAVITY_FORMAT: ${{ inputs.format }}
        GRAVITY_SINCE: ${{ inputs.since }}
        GRAVITY_CONTINUE_ON_FINDINGS: ${{ inputs.continue-on-findings }}
      run: |
        set -- $GRAVITY_COMMAND $GRAVITY_ARGS
        case "$GRAVITY_COMMAND" in
          "check api"|"check docs"|coverage)
            case " $GRAVITY_ARGS " in
              *" --format "*|*" --format="*|*" --json "*) ;;
              *) [ -n "$GRAVITY_FORMAT" ] && set -- "$@" --format "$GRAVITY_FORMAT" ;;
            esac
            ;;
        esac
        if [ -n "$GRAVITY_SINCE" ]; then
          set -- "$@" --since "$GRAVITY_SINCE"
        fi

        gravity --ci "$@" && code=0 || code=$?

        if [ "$code" -eq 1 ] && [ "$GRAVITY_CONTINUE_ON_FINDINGS" = "true" ]; then
          echo "::notice::gravity reported findings (exit 1); not failing the step."
          exit 0
        fi
        exit "$code"

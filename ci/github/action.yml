name: Gravity
description: Keep documentation in Gravity true to this repository. Installs the gravity CLI and runs `gravity run` for the detected trigger.
author: Grupo Impulso Digital
branding:
  icon: book-open
  color: purple

inputs:
  token:
    description: "Gravity token: pass `${{ secrets.GRAVITY_REPO_TOKEN || secrets.GRAVITY_TOKEN }}` (the repository token gravity init stores as GRAVITY_REPO_TOKEN, else a GRAVITY_TOKEN user or organization token). Empty only on fork and Dependabot pull requests, where the run is skipped with a notice; empty anywhere else fails with exit code 4."
    required: true
  command:
    description: "gravity command to run: run (default), check or status."
    required: false
    default: run
  args:
    description: Extra arguments for the command, for example `--pass developer-api`.
    required: false
    default: ""
  version:
    description: "gravity CLI to install: a major version (1), a release (v1.2.3), latest, or source (build from this action's checkout)."
    required: false
    default: "1"
  working-directory:
    description: Directory of the repository to run in.
    required: false
    default: .
  api-url:
    description: Gravity API base URL. Leave empty so .gravity.yaml (or the hosted default) decides.
    required: false
    default: ""

outputs:
  run-url:
    description: The Gravity run (or the bundle to review) this job produced.
    value: ${{ steps.gravity.outputs.run-url }}
  exit-code:
    description: "gravity's exit code: 0 success, 1 findings, 2 error, 3 licence refusal, 4 missing, unresolved or rejected token."
    value: ${{ steps.gravity.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Resolve gravity version
      id: resolve
      shell: bash
      env:
        GRAVITY_VERSION: ${{ inputs.version }}
        GRAVITY_RESOLVE_ONLY: "1"
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$GRAVITY_VERSION" = "source" ]; then
          tag=source
        else
          tag="$(sh "$GITHUB_ACTION_PATH/../../install.sh")"
        fi
        if [ -z "$tag" ]; then
          echo "::error::could not resolve gravity version '$GRAVITY_VERSION'"
          exit 2
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TOOL_CACHE/gravity/$tag-$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_OUTPUT"

    - name: Cache gravity
      id: cache
      if: steps.resolve.outputs.tag != 'source'
      uses: actions/cache@v4
      with:
        path: ${{ steps.resolve.outputs.dir }}
        key: gravity-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.tag }}

    - name: Install gravity
      if: steps.resolve.outputs.tag != 'source' && steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      env:
        GRAVITY_VERSION: ${{ steps.resolve.outputs.tag }}
        GRAVITY_INSTALL_DIR: ${{ steps.resolve.outputs.dir }}
      run: sh "$GITHUB_ACTION_PATH/../../install.sh"

    - name: Install gravity (Windows)
      if: steps.resolve.outputs.tag != 'source' && steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        GRAVITY_VERSION: ${{ steps.resolve.outputs.tag }}
        GRAVITY_INSTALL_DIR: ${{ steps.resolve.outputs.dir }}
      run: '& (Join-Path $env:GITHUB_ACTION_PATH "../../install.ps1")'

    - name: Set up Go
      if: steps.resolve.outputs.tag == 'source'
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/../../go.mod
        cache: false

    - name: Build gravity from source
      if: steps.resolve.outputs.tag == 'source'
      shell: bash
      env:
        GRAVITY_INSTALL_DIR: ${{ steps.resolve.outputs.dir }}
      run: |
        mkdir -p "$GRAVITY_INSTALL_DIR"
        cd "$GITHUB_ACTION_PATH/../.."
        pkg=github.com/Grupo-Impulso-Digital/gravity-cli/internal/version
        ver="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
        rev="$(git rev-parse HEAD 2>/dev/null || true)"
        go build -ldflags "-X $pkg.Version=$ver -X $pkg.Commit=$rev" -o "$GRAVITY_INSTALL_DIR/gravity" ./cmd/gravity

    - name: Put gravity on PATH
      shell: bash
      env:
        GRAVITY_BIN_DIR: ${{ steps.resolve.outputs.dir }}
      run: echo "$GRAVITY_BIN_DIR" >> "$GITHUB_PATH"

    - name: Gravity
      id: gravity
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GRAVITY_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_API_URL: ${{ inputs.api-url }}
      run: |
        case "$INPUT_COMMAND" in
          run|check|status) ;;
          *) echo "::error::command must be run, check or status; got '$INPUT_COMMAND'"; echo "exit-code=2" >> "$GITHUB_OUTPUT"; exit 2 ;;
        esac
        if [ -n "$INPUT_API_URL" ]; then
          export GRAVITY_API_URL="$INPUT_API_URL"
        fi
        set -f
        set +e
        gravity "$INPUT_COMMAND" $INPUT_ARGS
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"

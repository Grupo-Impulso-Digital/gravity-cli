version: 2

project_name: gravity

before:
  hooks:
    - go mod download

builds:
  - id: gravity
    main: ./cmd/gravity
    binary: gravity
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Grupo-Impulso-Digital/gravity-cli/internal/version.Version={{ .Version }} -X github.com/Grupo-Impulso-Digital/gravity-cli/internal/version.Commit={{ .FullCommit }} -X github.com/Grupo-Impulso-Digital/gravity-cli/internal/version.Date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: gravity
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

homebrew_casks:
  - name: gravity
    repository:
      owner: Grupo-Impulso-Digital
      name: homebrew-tap
      token: "{{ .Env.GORELEASER_TOKEN }}"
    homepage: "https://github.com/Grupo-Impulso-Digital/gravity-cli"
    description: "Keeps documentation in Gravity true to your code, from CI"
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gravity"]
          end

scoops:
  - repository:
      owner: Grupo-Impulso-Digital
      name: scoop-bucket
      token: "{{ .Env.GORELEASER_TOKEN }}"
    homepage: "https://github.com/Grupo-Impulso-Digital/gravity-cli"
    description: "Keeps documentation in Gravity true to your code, from CI"

release:
  github:
    owner: Grupo-Impulso-Digital
    name: gravity-cli
  draft: false
  prerelease: auto
  header: |
    {{- if and (eq .Major 1) (eq .Minor 0) (eq .Patch 0) }}
    ## gravity 1.0

    CLI 1.0 is a clean break: manifest v2 (`version: 2`), passes, and one command per job (`gravity run`). The v0.x commands and the v1 manifest are gone.

    - Pipelines on v0.3 keep working: `ci/github@v0`, `GRAVITY_VERSION=0` and the 0.x templates install the newest 0.x release, never 1.0.
    - To move: run `gravity init` in the repository. It converts `.gravity.yaml` once, writes the single-step CI file and sets the secret.
    - CI templates and the action default to major `1` (`ci/github@v1`, `GRAVITY_VERSION=1`), so 2.0 can never break a 1.x pipeline.
    {{- end }}

# GoReleaser builds the downloadable binaries the app's "Download" button hands
# out. Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# Validate changes locally with `goreleaser check` (see the Release section in
# AGENTS.md). Schema: GoReleaser v2.
version: 2

project_name: gravity

before:
  hooks:
    # download-only (not `tidy`): a release must never mutate committed files.
    - go mod download

builds:
  - id: gravity
    main: ./cmd/gravity
    binary: gravity
    env:
      # static binary — no libc dependency, runs on any matching OS/arch.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # matches the Makefile's version wiring (main.version). -s -w strips the
      # symbol table + DWARF to shrink the download.
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: gravity
    # install.sh reconstructs this exact name from the release tag + uname, so
    # keep it in sync with ./install.sh if you change it.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

# Homebrew tap — `brew install Grupo-Impulso-Digital/tap/gravity`. A cask (not a
# formula): casks ship the prebuilt binary directly, which is GoReleaser's
# recommended route for a Go CLI. Publishes to a separate repo, so it needs a
# cross-repo PAT (GORELEASER_TOKEN), not the workflow's default GITHUB_TOKEN.
homebrew_casks:
  - name: gravity
    repository:
      owner: Grupo-Impulso-Digital
      name: homebrew-tap
      token: "{{ .Env.GORELEASER_TOKEN }}"
    homepage: "https://github.com/Grupo-Impulso-Digital/gravity-cli"
    description: "CI/pipeline companion for the Gravity docs platform"
    # The binary is unsigned; strip the Gatekeeper quarantine xattr on install
    # so `gravity` runs without the "developer cannot be verified" prompt.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gravity"]
          end

# Scoop bucket (Windows) — `scoop install gravity`. Same cross-repo PAT.
scoops:
  - repository:
      owner: Grupo-Impulso-Digital
      name: scoop-bucket
      token: "{{ .Env.GORELEASER_TOKEN }}"
    homepage: "https://github.com/Grupo-Impulso-Digital/gravity-cli"
    description: "CI/pipeline companion for the Gravity docs platform"

release:
  github:
    owner: Grupo-Impulso-Digital
    name: gravity-cli
  draft: false
  # tags like v1.0.0-rc.1 land as GitHub pre-releases and are excluded from
  # /releases/latest, so `curl | sh` users stay on stable builds.
  prerelease: auto
